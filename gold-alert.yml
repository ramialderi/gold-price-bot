name: Gold Price Alert

on:
  workflow_dispatch:
    inputs:
      karats:
        description: "Comma-separated karats to report, e.g. 21,24"
        required: false
        default: "21,24"
      min_change_percent:
        description: "Only alert if price moved by at least this percent (0 = any change)"
        required: false
        default: "0"
  schedule:
    # Every 15 minutes. Gold spot prices don't usually move every
    # minute, so this is already frequent — widen it (e.g. */30) if
    # alerts feel too noisy once you see it running for real.
    - cron: "*/15 * * * *"

# Needed so the workflow can commit the updated price state back to
# the repo (GITHUB_TOKEN defaults to read-only on some accounts).
permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run gold price check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python gold_alert.py \
            --karats "${{ github.event.inputs.karats || '21,24' }}" \
            --min-change-percent "${{ github.event.inputs.min_change_percent || '0' }}" \
            --state gold_state.json

      - name: Commit updated price state
        run: |
          git config user.name "gold-alert-bot"
          git config user.email "actions@users.noreply.github.com"
          git add gold_state.json
          git diff --staged --quiet || git commit -m "Update gold price state [skip ci]"
          git push
